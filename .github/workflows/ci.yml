name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      test_suite:
        description: TestNG suite XML file
        type: string
        default: TestNG.xml
      reports:
        description: Report format
        type: string
        default: allure
      timeout:
        description: Test timeout in minutes
        type: string
        default: '15'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install Edge for Selenium
        uses: browser-actions/setup-edge@v1

      - name: Run Maven tests
        env:
          TEST_SUITE: ${{ inputs.test_suite || 'TestNG.xml' }}
          REPORTS: ${{ inputs.reports || 'allure' }}
          TEST_TIMEOUT_MINUTES: ${{ inputs.timeout || '15' }}
        run: |
          TEST_TIMEOUT_MS=$((TEST_TIMEOUT_MINUTES * 60000))
          mvn -B clean test -Dsurefire.suiteXmlFiles="$TEST_SUITE" -Dreports="$REPORTS" -Dtimeout="$TEST_TIMEOUT_MS"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-artifacts
          path: |
            target/surefire-reports/**
            allure-results/**
            ExtentReports/**
          if-no-files-found: ignore
