name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      test_suite:
        description: Maven test selector
        type: string
        default: testNG.xml
      browser:
        description: Browser to use
        type: string
        default: chrome
      reports:
        description: Report format
        type: string
        default: allure
      timeout:
        description: Test timeout in minutes
        type: string
        default: '15'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Chrome for Selenium
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set browser path for Selenium
        shell: bash
        run: |
          echo "CHROME_BIN=$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)" >> "$GITHUB_ENV"

      - name: Run Maven tests
        env:
          TEST_SUITE: ${{ inputs.test_suite || 'cicd' }}
          BROWSER: ${{ inputs.browser || 'chrome' }}
          REPORTS: ${{ inputs.reports || 'allure' }}
          TEST_TIMEOUT: ${{ inputs.timeout || '15' }}
        run: |
          mvn clean test -Dsuite="$TEST_SUITE" -Dbrowser="$BROWSER" -Dreports="$REPORTS" -Dtimeout="$TEST_TIMEOUT"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-artifacts
          path: |
            target/surefire-reports/**
            allure-results/**
            ExtentReports/**
          if-no-files-found: ignore
